# =[SS]=========================================================================
# 1. GENERAL & PREFIX SETTINGS
# ==============================================================================
# Remap prefix from 'Ctrl+b' to 'Ctrl+a' (easier to reach with left hand)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload tmux config easily with Prefix + r
bind r source-file ~/.tmux.conf \; display-message " Config reloaded!"

# Enable full mouse support (click tabs, resize panes, scroll back)
set -g mouse on

# Increase scrollback buffer history
set -g history-limit 50000

# Start window and pane indexing at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on  # Automatically renumber windows when one is closed

# Reduce escape time for faster command responsiveness (e.g. in Vim)
set -s escape-time 10

# Enable 256 color support
set -g default-terminal "screen-256color"

# ==============================================================================
# 2. INTUITIVE NAVIGATION & SPLITS
# ==============================================================================
# Split panes visually: | for vertical split, - for horizontal split
unbind '"'
unbind %
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes using Vim keys or Arrow keys (Prefix + h/j/k/l or Arrows)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using Shift + Arrow keys
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# Toggle pane zoom (maximize current pane) with Prefix + m or Prefix + z
bind m resize-pane -Z

# ==============================================================================
# 3. BUILT-IN CHEAT SHEET POPUP
# ==============================================================================
# Press Prefix + i to open an instant interactive cheat sheet popup overlay!
bind-key i display-popup -E -w 80% -h 80% "curl -s cheat.sh/tmux | less -R"

# ==============================================================================
# 4. COPY MODE & SELECTION
# ==============================================================================
# Use Vim keybindings in Copy Mode (Prefix + [ to enter copy mode)
setw -g mode-keys vi

# Press 'v' to begin selection, 'y' to copy in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

